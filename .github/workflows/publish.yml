# umtri-mcp npm 발행 — trusted publishing (OIDC)
#
# ⚠ 이 파일은 모노레포(Umtri)의 server/mcp/ 에 있지만, 여기서는 동작하지 않는다.
#   GitHub은 저장소 루트의 .github/workflows/ 만 읽는다. 이 파일이 살아 움직이는 곳은
#   scripts/sync-mcp.sh 가 밀어넣는 공개 미러(bepuljang/umtri-mcp)뿐이다.
#   미러에 직접 두면 다음 sync의 --delete로 지워지므로 원본을 여기 둔다.
#   npm 타르볼에는 안 들어간다 — package.json의 files 화이트리스트 밖.
#
# 왜 OIDC인가: npm이 2FA bypass 토큰을 직접 발행 경로에서 제한하는 중이라,
#   사람이 OTP를 넣는 것 말고는 이게 유일하게 지속 가능한 자동 발행 경로다.
#   NODE_AUTH_TOKEN도, 저장된 시크릿도 필요 없다.
#
# 사전 조건 — npmjs.com → umtri-mcp → Settings → Trusted Publisher 에 등록:
#   Organization or user : bepuljang
#   Repository           : umtri-mcp
#   Workflow filename    : publish.yml     (경로가 아니라 파일명만)
#
# 발행 흐름:
#   scripts/sync-mcp.sh  →  cd ../umtri-mcp && git push --follow-tags
#   → v* 태그가 이 워크플로를 깨우고 발행한다.

name: Publish to npm

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC 토큰 발급 — trusted publishing의 핵심. 빠지면 인증이 안 된다.
      contents: read

    steps:
      - uses: actions/checkout@v4

      # trusted publishing 요건: Node >= 22.14.0.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # 요건: npm >= 11.5.1. setup-node가 끼워주는 npm이 그보다 낮을 수 있어 명시적으로 올린다.
      - name: Ensure npm supports OIDC
        run: |
          npm install -g npm@latest
          npm --version

      # 태그와 package.json의 version이 어긋난 채 발행되는 사고를 막는다.
      # npm은 같은 버전 재발행이 안 되므로 되돌릴 수 없는 실수가 된다.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::태그 v$TAG 와 package.json v$PKG 가 다르다."
            exit 1
          fi
          echo "v$PKG 확인"

      - run: npm ci

      # --provenance 없음 — trusted publishing에서는 npm이 자동으로 붙인다.
      - run: npm publish
